<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ハイ＆ロー</title>
  <link rel="stylesheet" href="https://code.getmdl.io/1.3.0/material.indigo-pink.min.css">
  <!-- 丸ゴシック系フォントの追加 -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap">
  <script defer src="https://code.getmdl.io/1.3.0/material.min.js"></script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #FFFDE7; /* やさしいひよこ色の背景 */
      margin: 0;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      color: #4A4A4A;
    }

    h4 {
      font-size: 2.2rem;
      font-weight: 800;
      color: #FF6F00; /* あたたかいオレンジ */
      margin: 15px 0;
      text-shadow: 2px 2px 0px #FFE082;
    }

    .card-container {
      display: flex;
      justify-content: center;
      margin: 20px 0;
      gap: 20px;
    }

    .card {
      width: 120px;
      height: 170px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 5px solid #FFB74D;
      border-radius: 24px; /* 大きめの丸み */
      font-size: 3.5rem;
      font-weight: bold;
      background-color: #FFFFFF;
      color: #E65100;
      /* ぷっくりとした立体感のある影 */
      box-shadow: 0 8px 0px #FFE082, 0 10px 15px rgba(0,0,0,0.08);
    }

    .hidden-card {
      background-color: #E1F5FE;
      border-color: #81D4FA;
      color: #0288D1;
      box-shadow: 0 8px 0px #B3E5FC, 0 10px 15px rgba(0,0,0,0.08);
    }

    #questionText {
      font-size: 1.6rem;
      font-weight: bold;
      margin: 15px 0;
      color: #5D4037;
    }

    .button-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      width: 100%;
      max-width: 360px;
    }

    /* 押しやすくてぷっくりした丸型ボタン */
    .mdl-button {
      height: 60px;
      min-width: 130px;
      font-size: 1.4rem !important;
      font-weight: bold;
      border-radius: 30px !important;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      box-shadow: 0 6px 0px rgba(0,0,0,0.15) !important;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .mdl-button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0px rgba(0,0,0,0.15) !important;
    }

    #highButton {
      background-color: #FF5252 !important; /* 元気な赤 */
      color: #FFFFFF !important;
    }

    #lowButton {
      background-color: #42A5F5 !important; /* さわやかな青 */
      color: #FFFFFF !important;
    }

    #restartButton {
      background-color: #66BB6A !important; /* やさしい緑 */
      color: #FFFFFF !important;
      padding: 0 35px;
    }

    .probability {
      margin-top: 25px;
      padding: 15px 20px;
      background-color: #FFFFFF;
      border-radius: 20px;
      border: 3px dashed #FFD54F; /* 点線の枠 */
      font-size: 0.95rem;
      color: #5D4037;
      text-align: center;
    }

    .correct {
      font-weight: bold;
      font-size: 2.5rem;
      color: #FF4081; /* はっきりしたピンク */
    }

    .incorrect {
      font-weight: bold;
      font-size: 2.5rem;
      color: #7C4DFF; /* やわらかい紫 */
    }

    @media (max-width: 600px) {
      .card-container {
        flex-direction: row;
        justify-content: center;
        gap: 15px;
      }
      .card {
        width: 100px;
        height: 140px;
        font-size: 2.8rem;
      }
    }
  </style>
</head>
<body>

  <h4>ハイ＆ロー</h4>

  <div class="card-container">
    <div id="firstCard" class="card">7</div>
    <div id="secondCard" class="card hidden-card">?</div>
  </div>

  <p id="questionText">? は 7 よりも……</p>

  <div class="button-container" id="gameButtons">
    <button class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored" id="highButton">大きい</button>
    <button class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored" id="lowButton">小さい</button>
  </div>

  <button class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored" id="restartButton" style="display: none;">もういっかい</button>

  <div class="probability" id="probabilityDisplay">
    <p>大きい確率: <span id="highProbability"></span></p>
    <p>小さい確率: <span id="lowProbability"></span></p>
    <p id="probabilityFormula"></p>
  </div>

  <script>
    let firstCardValue = 7;
    let secondCardValue;
    const firstCard = document.getElementById('firstCard');
    const secondCard = document.getElementById('secondCard');
    const questionText = document.getElementById('questionText');
    const gameButtons = document.getElementById('gameButtons');
    const highButton = document.getElementById('highButton');
    const lowButton = document.getElementById('lowButton');
    const restartButton = document.getElementById('restartButton');
    const highProbability = document.getElementById('highProbability');
    const lowProbability = document.getElementById('lowProbability');
    const probabilityFormula = document.getElementById('probabilityFormula');

    function getRandomCard(exclude) {
      let card;
      do {
        card = Math.floor(Math.random() * 13) + 1;
      } while (card === exclude);
      return card;
    }

    function revealSecondCard() {
      secondCard.classList.remove('hidden-card');
      secondCard.textContent = secondCardValue;
    }

    function checkGuess(isHigh) {
      revealSecondCard();
      const isCorrect = (isHigh && secondCardValue > firstCardValue) || (!isHigh && secondCardValue < firstCardValue);
      questionText.innerHTML = isCorrect ? '<span class="correct">正解！</span>' : '<span class="incorrect">不正解！</span>';
      gameButtons.style.display = 'none';
      restartButton.style.display = 'inline-block';
    }

    function calculateProbabilities() {
      const largerCount = 13 - firstCardValue;
      const smallerCount = firstCardValue - 1;
      const highProb = (largerCount / 12 * 100).toFixed(2);
      const lowProb = (smallerCount / 12 * 100).toFixed(2);

      highProbability.textContent = `${highProb}%`;
      lowProbability.textContent = `${lowProb}%`;

      probabilityFormula.innerHTML = `
        <strong>計算式:</strong><br>
        大きい確率 = (13 - ${firstCardValue}) / 12 = ${largerCount}/12 = ${highProb}%<br>
        小さい確率 = (${firstCardValue} - 1) / 12 = ${smallerCount}/12 = ${lowProb}%`;
    }

    function restartGame() {
      firstCardValue = getRandomCard(null);
      secondCardValue = getRandomCard(firstCardValue);
      firstCard.textContent = firstCardValue;
      secondCard.textContent = '?';
      secondCard.classList.add('hidden-card');
      questionText.textContent = `? は ${firstCardValue} よりも……`;
      gameButtons.style.display = 'flex';
      restartButton.style.display = 'none';

      // 確率の計算を更新
      calculateProbabilities();
    }

    highButton.addEventListener('click', () => checkGuess(true));
    lowButton.addEventListener('click', () => checkGuess(false));
    restartButton.addEventListener('click', restartGame);

    // 初回のランダムカード設定
    restartGame();
  </script>

</body>
</html>
